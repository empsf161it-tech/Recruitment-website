<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — TalentForge</title>
  <meta name="description" content="Sign in to your TalentForge account to access your dashboard, saved jobs, and messages." />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png" />
  <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/rtl.css" />
</head>
<body>

  <main id="main-content">
    <div class="auth-page">
      <div class="auth-bg" aria-hidden="true"></div>
      <div style="position:absolute;top:var(--space-6);inset-inline-end:var(--space-6);display:flex;gap:var(--space-2);z-index:10;">
        <button class="nav-icon-btn theme-toggle-desktop" data-theme-toggle aria-label="Toggle dark mode" style="color:#F7F5F0;background:rgba(255,255,255,0.05);border-radius:var(--radius-sm)">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="nav-icon-btn" data-rtl-toggle aria-label="Toggle RTL direction" style="color:#F7F5F0;background:rgba(255,255,255,0.05);border-radius:var(--radius-sm)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16l-4-4 4-4"/><path d="M3 12h14"/><path d="M17 8l4 4-4 4"/></svg>
        </button>
      </div>

      <!-- Decorative background shapes -->
      <div aria-hidden="true" style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
        <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,0.08) 0%,transparent 70%);inset-block-start:-100px;inset-inline-end:-100px"></div>
        <div style="position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(10,22,40,0.05) 0%,transparent 70%);inset-block-end:-50px;inset-inline-start:-50px"></div>
      </div>

      <div class="auth-card">
        <!-- Logo -->
        <a href="index.html" class="auth-logo" aria-label="TalentForge Home">
          <div class="nav-logo-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          </div>
          <span class="nav-logo-text">Talent<span>Forge</span></span>
        </a>

        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your TalentForge account</p>

        <!-- Login Form -->
        <form class="auth-form" id="loginForm" novalidate aria-label="Login form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input
              type="email"
              id="login-email"
              name="email"
              class="form-input"
              placeholder="hello@company.com"
              required
              aria-required="true"
              autocomplete="email"
            />
            <span class="form-error" id="login-email-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="password-group">
              <input
                type="password"
                id="login-password"
                name="password"
                class="form-input"
                placeholder="••••••••"
                required
                aria-required="true"
                autocomplete="current-password"
              />
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <span class="form-error" id="login-password-error" role="alert"></span>
          </div>

          <div class="flex-between" style="margin-block-end:var(--space-6)">
            <div class="checkbox-group" style="margin:0">
              <input type="checkbox" id="login-remember" name="remember" class="checkbox-input" />
              <label for="login-remember" class="checkbox-label" style="font-size:var(--size-caption)">Remember me</label>
            </div>
            <a href="#" style="font-size:var(--size-caption);color:var(--color-secondary)">Forgot password?</a>
          </div>

          <div class="success-message" id="login-success" role="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;margin-inline-end:6px"><polyline points="20 6 9 17 4 12"/></svg>
            Successfully signed in! Redirecting to dashboard...
          </div>

          <button type="submit" class="btn btn-primary btn-lg" id="login-submit-btn" style="width:100%;max-width:100%;justify-content:center">
            Sign In
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          </button>
        </form>

        <!-- OAuth Divider -->
        <div class="auth-divider">
          <span>or continue with</span>
        </div>

        <!-- Google OAuth -->
        <button type="button" class="oauth-btn" id="google-login-btn" aria-label="Continue with Google">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <!-- Apple OAuth -->
        <button type="button" class="oauth-btn" id="apple-login-btn" aria-label="Continue with Apple">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          Continue with Apple
        </button>

        <div class="auth-footer">
          Don't have an account?
          <a href="register.html" id="go-to-register">Create one free</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  <script>
    // Login form validation
    document.addEventListener('DOMContentLoaded', () => {
      FormValidator.initForm('#loginForm', (form) => {
        const success = document.getElementById('login-success');
        if (success) {
          success.classList.add('visible');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
        }
      });
    });
  </script>
</body>
</html>
