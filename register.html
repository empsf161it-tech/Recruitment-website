<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — TalentForge</title>
  <meta name="description" content="Create your free TalentForge account and access exclusive job opportunities, career insights, and personalized talent matching." />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/rtl.css" />
</head>
<body>

  <main id="main-content">
    <div class="auth-page">
      <div class="auth-bg" aria-hidden="true"></div>

      <div aria-hidden="true" style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
        <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,0.08) 0%,transparent 70%);inset-block-start:-100px;inset-inline-end:-100px"></div>
        <div style="position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(10,22,40,0.05) 0%,transparent 70%);inset-block-end:-50px;inset-inline-start:-50px"></div>
      </div>

      <div class="auth-card" style="max-width:500px">
        <a href="index.html" class="auth-logo" aria-label="TalentForge Home">
          <div class="nav-logo-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          </div>
          <span class="nav-logo-text">Talent<span>Forge</span></span>
        </a>

        <h1 class="auth-title">Create Your Account</h1>
        <p class="auth-subtitle">Join 15,000+ professionals on TalentForge</p>

        <form class="auth-form" id="registerForm" novalidate aria-label="Registration form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="reg-fname">First Name <span aria-hidden="true">*</span></label>
              <input type="text" id="reg-fname" name="first_name" class="form-input" placeholder="Alexandra" required aria-required="true" autocomplete="given-name" />
              <span class="form-error" id="reg-fname-error" role="alert"></span>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-lname">Last Name <span aria-hidden="true">*</span></label>
              <input type="text" id="reg-lname" name="last_name" class="form-input" placeholder="Reid" required aria-required="true" autocomplete="family-name" />
              <span class="form-error" id="reg-lname-error" role="alert"></span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address <span aria-hidden="true">*</span></label>
            <input type="email" id="reg-email" name="email" class="form-input" placeholder="hello@company.com" required aria-required="true" autocomplete="email" />
            <span class="form-error" id="reg-email-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password <span aria-hidden="true">*</span></label>
            <div class="password-group">
              <input type="password" id="reg-password" name="password" class="form-input" placeholder="Min. 8 characters" required aria-required="true" autocomplete="new-password" />
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <span class="form-error" id="reg-password-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm Password <span aria-hidden="true">*</span></label>
            <div class="password-group">
              <input type="password" id="reg-confirm" name="confirmPassword" class="form-input" placeholder="Repeat your password" required aria-required="true" autocomplete="new-password" />
              <button type="button" class="password-toggle" aria-label="Toggle confirm password visibility">
                <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <span class="form-error" id="reg-confirm-error" role="alert"></span>
          </div>

          <div class="form-group">
            <div class="checkbox-group">
              <input type="checkbox" id="reg-terms" name="terms" class="checkbox-input terms-checkbox" aria-required="true" />
              <label for="reg-terms" class="checkbox-label">
                I accept the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a> of TalentForge
              </label>
            </div>
            <span class="form-error" id="reg-terms-error" role="alert"></span>
          </div>

          <div class="success-message" id="register-success" role="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;margin-inline-end:6px"><polyline points="20 6 9 17 4 12"/></svg>
            Account created! Redirecting to your dashboard...
          </div>

          <button type="submit" class="btn btn-primary btn-lg" id="register-submit-btn" style="width:100%;justify-content:center">
            Create Free Account
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          </button>
        </form>

        <div class="auth-divider"><span>or sign up with</span></div>

        <button type="button" class="oauth-btn" id="google-reg-btn" aria-label="Continue with Google">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <button type="button" class="oauth-btn" id="apple-reg-btn" aria-label="Continue with Apple">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          Continue with Apple
        </button>

        <div class="auth-footer">
          Already have an account?
          <a href="login.html" id="go-to-login">Sign in here</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FormValidator.initForm('#registerForm', (form) => {
        const success = document.getElementById('register-success');
        if (success) {
          success.classList.add('visible');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
        }
      });
    });
  </script>
</body>
</html>
